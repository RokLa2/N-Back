<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube N-Back</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0e1a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0e1a1f;--ink:#e6f1ee;--mute:#7f9a96;--line:#2a4248;--acc:#ffb347;--pos:#4fd1c5;--let:#f28ab2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0e1a1f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;gap:12px}
h1{font-size:20px;margin:0;font-weight:normal;letter-spacing:.02em}
#hud{color:var(--mute);font-size:14px;text-align:right}
#stage{position:relative;flex:1;min-height:0}
canvas{width:100%;height:100%;display:block}
#letter{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:64px;color:var(--let);opacity:0;transition:opacity .12s;pointer-events:none}
#letter.on{opacity:1}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
#card{background:#142a31ee;border:1px solid var(--line);border-radius:10px;padding:22px;max-width:380px;width:100%}
#card h2{margin:0 0 8px;font-weight:normal;font-size:22px}
#card p{margin:8px 0;color:var(--mute);font-size:15px;line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.row button{width:40px;height:40px;font-size:22px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#start{width:100%;padding:12px;background:var(--acc);color:#1b1205;border:0;font-size:17px}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 6px 8px}
#controls button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;height:clamp(84px,16vh,150px);font-size:clamp(17px,5.2vw,24px);line-height:1.3;padding:4px;border:0;border-radius:8px;background:#424242;color:#ececec;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#bp{border-color:var(--pos)}#bl{border-color:var(--let)}
#controls button.hit{background:#2c8f55;border-color:#2c8f55}
#controls button.bad{background:#c4303f;border-color:#c4303f}
#controls button.miss{background:#d9791a;border-color:#d9791a;color:#1b1205}
#bc{border-color:#b5e853}#bs{border-color:#6f9bff}
#controls svg{width:clamp(36px,11vw,60px);height:auto;flex:none;pointer-events:none}
#controls button.hit svg,#controls button.miss svg,#controls button.bad svg{color:inherit}
@media (hover:none) and (pointer:coarse){.key{display:none}}.kb{flex:1;padding:8px 2px;font-size:12px}
.hidden{display:none!important}
#card{max-height:100%;overflow:auto}
.sl{display:block;margin:12px 0;font-size:14px}.sl span{display:flex;justify-content:space-between}.sl input{width:100%;accent-color:var(--acc)}
#stop,#done{padding:6px 16px;border-color:var(--acc);color:var(--acc)}
#controls.arrange button{outline:2px dashed var(--acc);outline-offset:-6px;touch-action:none;cursor:grab}
#controls button.drag{opacity:.55}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
td,th{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);font-weight:normal}
td:first-child,th:first-child{text-align:left}
</style>
</head>
<body>
<header><h1>Cube N-Back</h1><div id="hud"></div><button id="stop" class="hidden">Stop</button><button id="done" class="hidden">Done</button></header>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="letter"></div>
  <div id="panel"><div id="card">
    <h2 id="ttl">Dual N-back in 3D</h2>
    <p id="txt">A block lights up in the cube and a letter is spoken. Press <b>Position</b> if the block is where it was N steps ago, and <b>Letter</b> if the letter matches N steps ago. Drag to rotate the cube, pinch or scroll to zoom.</p>
    <div id="res"></div>
    <div class="row"><span>N level</span><span><button id="dn" aria-label="Lower N">−</button> <b id="nv" style="display:inline-block;width:32px;text-align:center">2</b> <button id="up" aria-label="Raise N">+</button></span></div>
    <label class="sl"><span>Repeat chance <b id="spo"></b></span><input type="range" id="sp" min="0" max="60" step="5" value="30"></label>
    <label class="sl"><span>Steps per round <b id="sto"></b></span><input type="range" id="st" min="10" max="100" step="5" value="25"></label>
    <label class="sl"><span>Step duration <b id="sdo"></b></span><input type="range" id="sd" min="1" max="6" step="0.5" value="2.5"></label>
    <button id="vw" style="width:100%;padding:9px;margin-bottom:10px">View: 3D</button>
    <button id="hl" style="width:100%;padding:9px;margin-bottom:10px">Cell highlight: White</button>
    <button id="arr" style="width:100%;padding:9px;margin-bottom:10px">Rearrange response buttons</button>
    <button id="start">Start</button>
  </div></div>
</div>
<div id="controls">
  <button id="bp">Position (A)</button>
  <button id="bl">Letter (L)</button>
  <button id="bs">Shape (D)</button>
  <button id="bc">Color (S)</button>
</div>
<script src="three.min.js"></script>
<script>
(function(){
var LET="CHKLQRST".split(""),S=1.25,STEP=2500,SHOW=1000,PP=.3,PL=.3,TRIALS=25,PC=.3,PS=.3,FB=300,COLS=[0x4fd1c5,0xf28ab2,0x6f9bff,0xb5e853,0xc792ea,0xff6b6b],KEYS={p:"a",l:"l",c:"s",s:"d"},NAMES={p:"Position",l:"Sound",c:"Color",s:"Shape"},cap=null,GEOS=[new THREE.BoxGeometry(.95,.95,.95),new THREE.SphereGeometry(.58,24,16),new THREE.ConeGeometry(.68,.95,4).rotateY(Math.PI/4),new THREE.CylinderGeometry(.5,.5,.95,20),new THREE.OctahedronGeometry(.68)],EGEOS=GEOS.map(function(g,i){return new THREE.EdgesGeometry(g,i===1?10:30)}),GEOS2=[new THREE.PlaneGeometry(.9,.9),new THREE.CircleGeometry(.5,40),new THREE.CircleGeometry(.6,3).rotateZ(Math.PI/2).translate(0,-.15,0),new THREE.CircleGeometry(.6,4),new THREE.CircleGeometry(.55,5).rotateZ(Math.PI/2)],EGEOS2=GEOS2.map(function(g){return new THREE.EdgesGeometry(g,30)});
var N=2,running=false,seq=[],idx=-1,resp,stats,timer;

// ---- 3D scene
var cv=document.getElementById("c"),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,50);
var root=new THREE.Group();sc.add(root);
sc.add(new THREE.AmbientLight(0xffffff,.55));
var dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,6,5);sc.add(dl);
var cells=[],edgeGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),glowGeo=new THREE.BoxGeometry(1.02,1.02,1.02),tilePG=new THREE.PlaneGeometry(1.08,1.08),tileEdge=new THREE.EdgesGeometry(tilePG);
for(var i=0;i<27;i++){
  var x=i%3-1,y=Math.floor(i/3)%3-1,z=Math.floor(i/9)-1;
  var g=new THREE.Group();g.position.set(x*S,y*S,z*S);
  var e=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0x4d7a82,transparent:true,opacity:.35}));
  var m=new THREE.Mesh(new THREE.BoxGeometry(.95,.95,.95),new THREE.MeshBasicMaterial({color:0x4fd1c5,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
  m.visible=false;var gl=new THREE.Mesh(glowGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.28,depthWrite:false,side:THREE.BackSide}));gl.visible=false;m.userData.fr=e;m.userData.gl=gl;
  var tl=new THREE.Mesh(tilePG,new THREE.MeshBasicMaterial({color:0x16272d})),to=new THREE.LineSegments(tileEdge,new THREE.LineBasicMaterial({color:0x3d6068}));
  tl.position.z=-.05;to.position.z=-.04;tl.visible=to.visible=false;m.userData.tl=tl;m.userData.to=to;
  g.add(e);g.add(gl);g.add(tl);g.add(to);g.add(m);root.add(g);cells.push(m);
}
var th=.7,ph=.5,dist=9.5,drag=false,lx,ly,dmin=6,dmax=20,zoomed=false,M2=false,pts={},pd=0;
function place(){cam.position.set(dist*Math.sin(th)*Math.cos(ph),dist*Math.sin(ph),dist*Math.cos(th)*Math.cos(ph));cam.lookAt(0,0,0)}
function zoom(d){zoomed=true;dist=Math.max(dmin,Math.min(dmax,d))}
function pdist(){var k=Object.keys(pts),a=pts[k[0]],b=pts[k[1]];return Math.hypot(a[0]-b[0],a[1]-b[1])}
cv.addEventListener("pointerdown",function(e){pts[e.pointerId]=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);drag=true;lx=e.clientX;ly=e.clientY;if(Object.keys(pts).length===2)pd=pdist()});
cv.addEventListener("pointermove",function(e){if(!pts[e.pointerId])return;pts[e.pointerId]=[e.clientX,e.clientY];
  if(Object.keys(pts).length>=2){var d=pdist();if(pd&&d)zoom(dist*pd/d);pd=d;return}
  if(M2)return;th-=(e.clientX-lx)*.01;ph=Math.max(-1.4,Math.min(1.4,ph+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY});
function up(e){delete pts[e.pointerId];pd=0;var k=Object.keys(pts);if(k.length===1){lx=pts[k[0]][0];ly=pts[k[0]][1]}else if(!k.length)drag=false}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",function(e){e.preventDefault();zoom(dist*Math.exp(e.deltaY*.0012))},{passive:false});
function resize(){var s=document.getElementById("stage");R.setSize(s.clientWidth,s.clientHeight,false);cam.aspect=s.clientWidth/s.clientHeight;var t=Math.min(1,cam.aspect)*Math.tan(cam.fov*Math.PI/360),dfit=(M2?2.1:2.99)*Math.sqrt(1+t*t)/t;
  dmin=M2?1.79/t:1.725+1.725/t;dmax=dfit*1.6;if(!zoomed)dist=dfit*(M2?1:1.2);dist=Math.max(dmin,Math.min(dmax,dist));var W=s.clientWidth,H=s.clientHeight;cam.setViewOffset(W,H,0,Math.round(H*.08),W,H);cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
(function loop(){if(M2){th=0;ph=0}else if(!drag&&!reduce)th+=.0035;place();R.render(sc,cam);requestAnimationFrame(loop)})();

// ---- game
var $=function(id){return document.getElementById(id)};
function speak(l){try{var u=new SpeechSynthesisUtterance(l);u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function build(total){
  var s=[];
  for(var i=0;i<total;i++){
    var p=M2?9+Math.floor(Math.random()*9):Math.floor(Math.random()*27),l=Math.floor(Math.random()*LET.length),c=Math.floor(Math.random()*COLS.length),q=Math.floor(Math.random()*GEOS.length);
    if(i>=N){if(Math.random()<PP)p=s[i-N].p;if(Math.random()<PL)l=s[i-N].l;if(Math.random()<PC)c=s[i-N].c;if(Math.random()<PS)q=s[i-N].s}
    s.push({p:p,l:l,c:c,s:q});
  }
  return s;
}
function startGame(){
  PP=PL=PC=PS=$("sp").value/100;FB=Math.min(300,$("sd").value*250);TRIALS=+$("st").value;STEP=$("sd").value*1000;SHOW=Math.min(1000,STEP*.6);
  seq=build(TRIALS);idx=-1;running=true;$("stop").classList.remove("hidden");
  stats={p:{h:0,m:0,f:0},l:{h:0,m:0,f:0},c:{h:0,m:0,f:0},s:{h:0,m:0,f:0}};
  $("panel").classList.add("hidden");
  next();
}
function next(){
  idx++;
  if(idx>=seq.length){return finish()}
  resp={p:false,l:false,c:false,s:false};
  ["bp","bl","bc","bs"].forEach(function(b){$(b).className=""});
  var t=seq[idx];
  var m=cells[t.p],u=m.userData;
  if(!u.ln){u.ln=new THREE.LineSegments(EGEOS[0],new THREE.LineBasicMaterial({color:0x0b1418}));m.add(u.ln)}
  m.visible=true;m.material.color.setHex(COLS[t.c]);m.geometry=(M2?GEOS2:GEOS)[t.s];u.ln.geometry=(M2?EGEOS2:EGEOS)[t.s];
  if(HLM<2){var hc=HLM===0?0xffffff:COLS[t.c];if(M2){u.to.material.color.setHex(hc);u.tl.material.color.setHex(mix(hc))}else{u.fr.material.color.setHex(hc);u.fr.material.opacity=1;u.gl.material.color.setHex(hc);u.gl.visible=true}}
  $("letter").textContent=LET[t.l];$("letter").style.color="#"+("000000"+COLS[t.c].toString(16)).slice(-6);$("letter").classList.add("on");speak(LET[t.l]);
  $("hud").textContent="N = "+N+"  ·  "+(idx+1)+" / "+seq.length;
  setTimeout(function(){off(cells[t.p]);$("letter").classList.remove("on")},SHOW);
  timer=setTimeout(function(){score();timer=setTimeout(next,FB)},STEP-FB);
}
function score(){
  var t=seq[idx];
  [["p","bp"],["l","bl"],["c","bc"],["s","bs"]].forEach(function(k){
    var m=idx>=N&&seq[idx-N][k[0]]===t[k[0]],r=resp[k[0]];
    if(m&&r)stats[k[0]].h++;else if(m&&!r){stats[k[0]].m++;$(k[1]).className="miss"}else if(!m&&r)stats[k[0]].f++;
  });
}
function press(k){
  if(!running||idx<0||resp[k])return;
  resp[k]=true;
  var t=seq[idx],m=idx>=N&&seq[idx-N][k]===t[k];
  $("b"+k).className=m?"hit":"bad";
}
function pct(o){var d=o.h+o.m+o.f;return d?Math.round(100*o.h/d)+"%":"–"}
function finish(stopped){
  running=false;clearTimeout(timer);$("stop").classList.add("hidden");
  cells.forEach(off);$("letter").classList.remove("on");
  $("hud").textContent="";
  $("ttl").textContent=stopped===true?"Stopped":"Round complete";
  $("txt").textContent="Level N = "+N+". Accuracy counts hits against misses and false alarms.";
  $("res").innerHTML="<table><tr><th></th><th>Hits</th><th>Missed</th><th>False</th><th>Score</th></tr>"+
   "<tr><td>Position</td><td>"+stats.p.h+"</td><td>"+stats.p.m+"</td><td>"+stats.p.f+"</td><td>"+pct(stats.p)+"</td></tr>"+
   "<tr><td>Sound</td><td>"+stats.l.h+"</td><td>"+stats.l.m+"</td><td>"+stats.l.f+"</td><td>"+pct(stats.l)+"</td></tr><tr><td>Color</td><td>"+stats.c.h+"</td><td>"+stats.c.m+"</td><td>"+stats.c.f+"</td><td>"+pct(stats.c)+"</td></tr><tr><td>Shape</td><td>"+stats.s.h+"</td><td>"+stats.s.m+"</td><td>"+stats.s.f+"</td><td>"+pct(stats.s)+"</td></tr></table>";
  $("start").textContent="Play again";
  $("panel").classList.remove("hidden");
}
var HLM=0,HLN=["White","Shape color","Off"];
function off(c){c.visible=false;var u=c.userData;u.fr.material.color.setHex(0x4d7a82);u.fr.material.opacity=.35;u.gl.visible=false;u.tl.material.color.setHex(0x16272d);u.to.material.color.setHex(0x3d6068)}
function mix(c){var o=0;[16,8,0].forEach(function(sh){var a=0x16272d>>sh&255,b=c>>sh&255;o|=Math.round(a+(b-a)*.3)<<sh});return o}
function apply2D(){cells.forEach(function(m,i){var u=m.userData,on=M2&&i>=9&&i<18;m.parent.visible=!M2||on;u.fr.visible=!M2;u.tl.visible=u.to.visible=on});if(M2){th=0;ph=0}else{th=.7;ph=.5}zoomed=false;resize()}
$("vw").onclick=function(){M2=!M2;$("vw").textContent="View: "+(M2?"2D":"3D");apply2D()};
$("hl").onclick=function(){HLM=(HLM+1)%3;$("hl").textContent="Cell highlight: "+HLN[HLM]};
$("start").onclick=startGame;
$("stop").onclick=function(){finish(true)};
function bind(id,f){var e=$(id),o=$(id+"o");function u(){o.textContent=f(e.value)}e.oninput=u;u()}
bind("sp",function(v){return v+"%"});
bind("st",function(v){return v});bind("sd",function(v){return (+v).toFixed(1)+" s"});
$("up").onclick=function(){if(N<9)N++;$("nv").textContent=N};
$("dn").onclick=function(){if(N>1)N--;$("nv").textContent=N};
$("bp").onpointerdown=function(e){e.preventDefault();press("p")};
$("bl").onpointerdown=function(e){e.preventDefault();press("l")};
$("bc").onpointerdown=function(e){e.preventDefault();press("c")};$("bs").onpointerdown=function(e){e.preventDefault();press("s")};
function ic(x){return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+x+'</svg>'}
var ICONS={
 p:ic('<rect x="1.5" y="1.5" width="6" height="6" rx="1.2"/><rect x="9" y="1.5" width="6" height="6" rx="1.2"/><rect x="16.5" y="1.5" width="6" height="6" rx="1.2"/><rect x="1.5" y="9" width="6" height="6" rx="1.2"/><rect x="9" y="9" width="6" height="6" rx="1.2"/><rect x="16.5" y="9" width="6" height="6" rx="1.2"/><rect x="1.5" y="16.5" width="6" height="6" rx="1.2"/><rect x="9" y="16.5" width="6" height="6" rx="1.2"/><rect x="16.5" y="16.5" width="6" height="6" rx="1.2"/>'),
 l:ic('<path d="M5.25 14v-2a6.75 6.75 0 0113.5 0v2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><rect x="3" y="12" width="4.5" height="8" rx="2.2"/><rect x="16.5" y="12" width="4.5" height="8" rx="2.2"/>'),
 s:ic('<path d="M12 5L19.5 18.5H4.5z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>'),
 c:ic('<path fill-rule="evenodd" d="M12 3a9 9 0 100 18c1.5 0 2.2-1 2.2-2 0-1.4-1.1-1.6-1.1-2.6 0-.9.7-1.4 1.6-1.4H17a4 4 0 004-4c0-4.4-4-8-9-8zM6.2 11a1.3 1.3 0 102.6 0a1.3 1.3 0 10-2.6 0zM8.7 7.2a1.3 1.3 0 102.6 0a1.3 1.3 0 10-2.6 0zM13.2 7.2a1.3 1.3 0 102.6 0a1.3 1.3 0 10-2.6 0zM6.5 15.3a1.3 1.3 0 102.6 0a1.3 1.3 0 10-2.6 0z"/>')};
function kn(k){return k===" "?"Space":k.length>1?k:k.toUpperCase()}
function labels(){["p","l","c","s"].forEach(function(k){var b=$("b"+k),t=NAMES[k]+" ("+kn(KEYS[k])+")";b.innerHTML=ICONS[k]+"<span>"+NAMES[k].toLowerCase()+"</span>";b.setAttribute("aria-label",t);b.title=t});
  document.querySelectorAll(".kb").forEach(function(b){var k=b.dataset.k;b.textContent=cap===k?"Press a key…":NAMES[k]+": "+kn(KEYS[k])})}
document.querySelectorAll(".kb").forEach(function(b){b.onclick=function(){cap=cap===b.dataset.k?null:b.dataset.k;labels()}});
addEventListener("keydown",function(e){var k=e.key.toLowerCase();
  if(["shift","control","alt","meta"].indexOf(k)>=0)return;
  if(cap){e.preventDefault();if(k!=="escape"){for(var x in KEYS)if(KEYS[x]===k)KEYS[x]=KEYS[cap];KEYS[cap]=k}cap=null;labels();return}
  for(var x in KEYS)if(KEYS[x]===k){e.preventDefault();press(x)}
});
labels();
var arr=false,dg=null,CT=$("controls"),IDS=["bp","bl","bc","bs"];
function save(){try{localStorage.setItem("nb-order2",[].map.call(CT.children,function(b){return b.id}).join())}catch(e){}}
try{var o=(localStorage.getItem("nb-order2")||"").split(",");if(o.length===4&&o.every(function(i){return IDS.indexOf(i)>=0})&&o.slice().sort().join()===IDS.slice().sort().join())o.forEach(function(i){CT.appendChild($(i))})}catch(e){}
function setArr(on){arr=on;CT.classList.toggle("arrange",on);$("panel").classList.toggle("hidden",on);$("done").classList.toggle("hidden",!on);$("hud").textContent=on?"Drag the buttons to reorder":""}
$("arr").onclick=function(){setArr(true)};
$("done").onclick=function(){setArr(false);save()};
CT.addEventListener("pointerdown",function(e){if(!arr)return;var b=e.target.closest("button");if(!b)return;dg=b;b.classList.add("drag");CT.setPointerCapture(e.pointerId)});
CT.addEventListener("pointermove",function(e){if(!dg)return;var r=CT.getBoundingClientRect(),bs=[].slice.call(CT.children),sl=Math.max(0,Math.min(1,Math.floor((e.clientY-r.top)/(r.height/2))))*2+Math.max(0,Math.min(1,Math.floor((e.clientX-r.left)/(r.width/2)))),cur=bs.indexOf(dg);
  if(sl>cur)CT.insertBefore(dg,bs[sl].nextSibling);else if(sl<cur)CT.insertBefore(dg,bs[sl])});
function endDrag(){if(dg){dg.classList.remove("drag");dg=null}}
CT.addEventListener("pointerup",endDrag);CT.addEventListener("pointercancel",endDrag);
